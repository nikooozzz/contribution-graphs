name: Feature Request
description: Suggest a new platform adapter, renderer enhancement, or worker feature.
title: "[Feature]: "
labels: ["type: feature", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea! Please fill out the details below to help us evaluate and scope this feature.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem is this feature intended to solve? What are you currently unable to do?
      placeholder: e.g., I want to pull contribution data from Bitbucket, but there is currently no native adapter for it.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like to see happen. Feel free to suggest query parameter designs or adapter specifications.
      placeholder: |
        Add a `bitbucket:username` composite source parser that queries the Bitbucket REST API for public contributions.
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which part of the worker does this primarily affect?
      options:
        - New Platform Adapter (e.g., Bitbucket, Sourcehut, etc.)
        - SVG Renderer / Badge Styling
        - Router / Query Parameters / API Versioning
        - Developer Experience / CI / Docs
        - Other / General
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative workarounds or solutions?
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: By opening this request, you agree to follow our contribution guidelines.
      options:
        - label: I have searched existing issues to ensure this feature hasn't already been requested.
          required: true