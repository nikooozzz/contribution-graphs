name: Update Issue Status on PR Merge

on:
  pull_request:
    types: [opened, edited, closed]

jobs:
  on-pr-opened-or-edited:
    if: github.event.action == 'opened' || github.event.action == 'edited'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Assign Author & Set In-Progress
        uses: actions/github-script@v7
        with:
          script: |
            const pr = github.event.pull_request;
            const prBody = pr.body || "";
            const author = pr.user.login;

            const regex = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi;
            const matches = [...prBody.matchAll(regex)];
            const issueNumbers = [...new Set(matches.map(m => parseInt(m[1], 10)))];

            if (issueNumbers.length === 0) return;

            for (const issueNumber of issueNumbers) {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });

                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });

                const statusLabels = issue.labels
                  .map(l => typeof l === 'string' ? l : l.name)
                  .filter(n => n.startsWith('status:'));
                
                if (!statusLabels.includes('status: in-progress')) {
                  for (const label of statusLabels) {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNumber,
                      name: label,
                    }).catch(() => {});
                  }

                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    labels: ['status: in-progress'],
                  });
                }

                console.log(`Assigned ${author} & updated issue #${issueNumber} -> status: in-progress`);
              } catch (error) {
                console.error(`Failed to update issue #${issueNumber}:`, error);
              }
            }

  on-pr-merged:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    
    steps:
      - name: Update Linked Issue Labels
        uses: actions/github-script@v7
        with:
          script: |
            const prBody = github.event.pull_request.body || "";
            const regex = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi;
            const matches = [...prBody.matchAll(regex)];
            const issueNumbers = [...new Set(matches.map(m => parseInt(m[1], 10)))];

            if (issueNumbers.length === 0) return;

            for (const issueNumber of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });

                const statusLabels = issue.labels
                  .map(l => typeof l === 'string' ? l : l.name)
                  .filter(n => n.startsWith('status:'));

                for (const label of statusLabels) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name: label,
                  }).catch(() => {});
                }

                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ['status: resolved'],
                });

                console.log(`Updated issue #${issueNumber} -> status: resolved`);
              } catch (error) {
                console.error(`Failed to resolve issue #${issueNumber}:`, error);
              }
            }